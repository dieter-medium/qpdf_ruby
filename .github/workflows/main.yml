name: Ruby
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: qpdf libqpdf-dev
          version: 1.0
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The veraPDF examples in spec/acceptance/chromium_pdfua_spec.rb are the PDF/UA-1 conformance
      # check; REQUIRE_VERAPDF=1 makes them fail instead of skip if this step left no verapdf behind.
      # Java, curl and unzip come with the runner image.
      - name: Cache veraPDF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verapdf
          key: verapdf-${{ runner.os }}-${{ hashFiles('bin/install-verapdf.sh') }}
      - name: Install veraPDF
        run: dirname "$(bin/install-verapdf.sh "$HOME/verapdf")" >> "$GITHUB_PATH"
      - name: Run the default task
        env:
          REQUIRE_VERAPDF: "1"
        run: bundle exec rake
      - name: Build the gem
        run: bundle exec rake build
      - name: Upload gem
        # Once - artifact names must be unique across the matrix.
        if: matrix.ruby == '4.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qpdf_ruby-gem
          path: pkg/

  push_docker_to_registry:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
    name: Push qpdf_ruby cli Docker image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: default
            file: ./docker/Dockerfile
            suffix: ""
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download gem package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qpdf_ruby-gem
          path: pkg

      - name: Set up QEMU (for the arm64 image)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dieters877565/qpdf-ruby
          tags: |
            type=ref,event=branch,suffix=${{matrix.variant.suffix}}
            type=semver,pattern={{version}}${{matrix.variant.suffix}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.file }}
          # Pushes from main and v* tags only - the job never runs for pull requests.
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
